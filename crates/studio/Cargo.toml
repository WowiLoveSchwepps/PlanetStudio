[package]
name = "planet-studio"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Studio d'animation pour les modèles de PlanetSide 2 (style Source Filmmaker)"

[[bin]]
name = "planet-studio"
path = "src/main.rs"

[dependencies]
forgelight = { path = "../forgelight" }
eframe = { version = "=0.31.1", default-features = false, features = ["wgpu", "default_fonts", "accesskit"] }
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.17"
pollster = "0.4"
rav1e = { version = "0.8", default-features = false, features = ["threading"] }
glam.workspace = true
anyhow.workspace = true
rayon.workspace = true
gif = "0.14"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff", "bmp", "tga", "webp"] }
openh264-sys2 = "0.9"
# téléchargement de ffmpeg : vérification et extraction de l'archive
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
rfd = "0.15"
