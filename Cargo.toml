[workspace]
resolver = "2"
members = ["crates/forgelight", "crates/flcli", "crates/studio"]

[workspace.package]
edition = "2021"
version = "0.3.0"
license = "GPL-3.0-or-later"
repository = "https://github.com/WowiLoveSchwepps/PlanetStudio"

[workspace.dependencies]
glam = { version = "0.29", features = ["serde", "bytemuck"] }
anyhow = "1"
rayon = "1.10"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = false
