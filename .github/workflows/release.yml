# Publie une Release quand un tag de version est poussé :
#   git tag v0.2.0
#   git push origin v0.2.0
# Le tag doit correspondre à la version de Cargo.toml ([workspace.package] version).
# PlanetStudio lit cette Release pour proposer la mise à jour (crates/studio/src/update.rs).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # historique et tags complets, pour le changelog

      - name: Version du tag = version de Cargo.toml
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $ver = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.+)"').Matches[0].Groups[1].Value
          if ($tag -ne $ver) { Write-Error "Tag v$tag different de la version de Cargo.toml ($ver)"; exit 1 }

      # Changelog = sujets des commits depuis le tag précédent (hors merges, hors « Version x.y.z »,
      # doublons retirés). Sert de notes à la Release (affichées par l'updater) et à l'annonce Discord.
      - name: Changelog
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [Text.UTF8Encoding]::new()
          $tag = "${{ github.ref_name }}"
          $prev = git describe --tags --abbrev=0 --match "v*" "$tag^" 2>$null
          if ($LASTEXITCODE -ne 0) { $prev = $null }
          $range = if ($prev) { "$prev..$tag" } else { $tag }
          $seen = [Collections.Generic.HashSet[string]]::new()
          $changes = @(git log $range --no-merges --format=%s |
            Where-Object { $_ -notmatch '^Version \d' -and $seen.Add($_) } |
            ForEach-Object { "- $_" })
          if (-not $changes) { $changes = @("- Corrections et améliorations mineures") }
          $changes -join "`n" | Set-Content -Encoding utf8NoBOM -NoNewline "$env:RUNNER_TEMP/changes.md"
          $notes = $changes -join "`n"
          if ($prev) { $notes += "`n`nHistorique complet : ${{ github.server_url }}/${{ github.repository }}/compare/$prev...$tag" }
          $notes | Set-Content -Encoding utf8NoBOM -NoNewline "$env:RUNNER_TEMP/notes.md"
          Write-Host $notes

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Tests
        run: cargo test --release -p planet-studio

      - name: Compilation
        run: cargo build --release -p planet-studio

      - name: Licences des dépendances
        run: |
          cargo install cargo-about --version 0.9.3 --locked --features cli
          cargo about generate about.hbs --output-file THIRD_PARTY_LICENSES.txt

      - name: Archive et empreinte
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/planet-studio.exe dist/
          Copy-Item LICENSE dist/LICENSE.txt
          Copy-Item THIRD_PARTY_LICENSES.txt dist/
          Compress-Archive -Path dist/* -DestinationPath PlanetStudio-windows-x64.zip
          $hash = (Get-FileHash PlanetStudio-windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  PlanetStudio-windows-x64.zip" | Out-File -Encoding ascii -NoNewline PlanetStudio-windows-x64.zip.sha256

      - name: Publication
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "${{ github.ref_name }}" `
            PlanetStudio-windows-x64.zip PlanetStudio-windows-x64.zip.sha256 `
            --title "PlanetStudio ${{ github.ref_name }}" --notes-file "$env:RUNNER_TEMP/notes.md"

      # Annonce sur Discord (secret WEBHOOK = URL du webhook du salon). Sans le secret, l'étape
      # ne fait rien ; si Discord échoue, la Release reste publiée et le job reste vert.
      - name: Annonce Discord
        continue-on-error: true
        env:
          WEBHOOK: ${{ secrets.WEBHOOK }}
        shell: pwsh
        run: |
          if (-not $env:WEBHOOK) { Write-Host "Secret WEBHOOK absent : annonce ignorée"; exit 0 }
          $tag = "${{ github.ref_name }}"
          $url = "${{ github.server_url }}/${{ github.repository }}/releases/tag/$tag"
          $changes = Get-Content -Raw -Encoding utf8 "$env:RUNNER_TEMP/changes.md"
          # Description d'un embed : 4096 caractères max ; on coupe sur une fin de ligne.
          if ($changes.Length -gt 3800) {
            $changes = $changes.Substring(0, $changes.LastIndexOf("`n", 3800)) + "`n- …"
          }
          $payload = @{
            username = "PlanetStudio"
            embeds   = @(@{
              title       = "PlanetStudio $tag est disponible"
              url         = $url
              color       = 5214184
              description = "**Nouveautés**`n$changes`n`n[Télécharger]($url) · ou via la mise à jour intégrée"
              timestamp   = (Get-Date).ToUniversalTime().ToString("o")
            })
          } | ConvertTo-Json -Depth 5
          Invoke-RestMethod -Method Post -Uri $env:WEBHOOK `
            -ContentType "application/json; charset=utf-8" `
            -Body ([Text.Encoding]::UTF8.GetBytes($payload))
